# 按系统分开跑：静态检查在任何系统上都一样；测试要以 Windows 为准（桌面操控 /
# AppContainer / Edge 路径都是 Windows 专属）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  desktop:
    # 桌面端与主进程的编译/单测放这里：纯 Python 的作业看不到 TS/CSS 回归
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 换到 GitHub 可达的 registry
        working-directory: desktop
        # 锁文件是开发者用国内镜像生成的；runner 上访问 npmmirror 不稳定
        run: sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
      - name: 安装依赖
        working-directory: desktop
        shell: bash
        run: |
          set -o pipefail
          # 锁文件是在 Windows 上生成的，只含 win32 的 esbuild 可选依赖；
          # Linux 上 npm ci 会报 Missing: @esbuild/linux-x64 → 用 install 补齐平台包
          npm install --no-audit --no-fund 2>&1 | tee npm-ci.log
      - name: npm ci 失败摘要
        if: failure()
        working-directory: desktop
        shell: bash
        run: |
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 15 ] && break
            echo "::error::${line//'%'/'%25'}"
          done < <(tail -20 npm-ci.log 2>/dev/null || true)
      - name: 单元测试
        working-directory: desktop
        run: npx vitest run
      - name: 构建
        working-directory: desktop
        run: npm run build

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 安装浏览器内核
        run: python -m playwright install chromium
      - name: 全量测试
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=line -rf 2>&1 | tee pytest.log
      # GitHub 的作业日志要登录才能看；失败用例名写成 annotation 才能被外部读到
      - name: 失败摘要
        if: failure()
        shell: bash
        run: |
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::${line//'%'/'%25'}"
          done < <(grep -E '^(FAILED|ERROR) ' pytest.log || true)

  desktop-smoke:
    # Electron 启动冒烟：构建过了不等于窗口能起来。先只报告不阻塞（无后端环境）。
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 换到 GitHub 可达的 registry
        working-directory: desktop
        run: sed -i 's#https://registry.npmmirror.com#https://registry.npmjs.org#g' package-lock.json
      - name: 安装依赖（含 Electron 二进制）
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Electron 启动冒烟
        working-directory: desktop
        run: xvfb-run -a node scripts/electron-smoke.cjs

  test-linux:
    # 一批 Windows 专属用例（桌面操控 / 沙箱 / Edge 路径）在 Linux 上会挂住，
    # 跑到 30 分钟被取消、把整次 CI 标成失败。Linux 支持还没做，先只在手动触发时跑。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: 安装浏览器内核与系统依赖
        run: |
          python -m playwright install --with-deps chromium
      - name: 全量测试
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=line -rf 2>&1 | tee pytest.log
      - name: 失败摘要
        if: failure()
        shell: bash
        run: |
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::error::${line//'%'/'%25'}"
          done < <(grep -E '^(FAILED|ERROR) ' pytest.log || true)
