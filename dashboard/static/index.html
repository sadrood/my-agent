<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小悟 · 协作工作台</title>
<style>
/* ============ 基础 & 变量 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0e1117; --bg2: #171b26; --bg3: #1f2433; --bg4: #262c3d;
  --text: #e7e9f0; --text2: #9aa1b5; --text3: #5c6478;
  --accent: #6366f1; --accent-soft: rgba(99,102,241,.14); --accent2: #8b8ff8;
  --green: #34d399; --red: #f87171; --yellow: #fbbf24; --blue: #60a5fa;
  --border: #262c3d; --radius: 12px;
  --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.65; overflow: hidden;
}
::selection { background: rgba(99,102,241,.35); }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2c3350; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #38406b; }
button { font-family: inherit; cursor: pointer; border: 0; }

/* ============ 顶栏 ============ */
.header {
  height: 54px; display: flex; align-items: center; gap: 12px;
  padding: 0 18px; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; user-select: none;
}
.logo { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.logo-mark {
  width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; font-weight: 800; font-size: 16px;
  box-shadow: 0 2px 10px rgba(99,102,241,.35);
}
.logo-name { font-weight: 700; font-size: 15px; letter-spacing: .2px; }
.logo-sub { font-size: 11px; color: var(--text3); margin-top: -2px; }
.status-badge {
  padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 600;
  background: var(--bg3); color: var(--text2); display: flex; align-items: center; gap: 6px;
  transition: all .25s; flex-shrink: 0;
}
.status-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
.status-badge.running { background: var(--accent-soft); color: var(--accent2); }
.status-badge.running .dot { background: var(--accent2); animation: blink 1.1s ease-in-out infinite; }
.status-badge.completed { background: rgba(52,211,153,.12); color: var(--green); }
.status-badge.completed .dot { background: var(--green); }
.status-badge.error { background: rgba(248,113,113,.12); color: var(--red); }
.status-badge.error .dot { background: var(--red); }
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
.goal-text {
  flex: 1; min-width: 0; font-size: 13px; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,.6); }
.conn-dot.disconnected { background: var(--red); box-shadow: 0 0 8px rgba(248,113,113,.5); }
.icon-btn {
  background: var(--bg3); color: var(--text2); border: 1px solid var(--border);
  border-radius: 9px; padding: 7px 12px; font-size: 13px; display: flex; align-items: center; gap: 6px;
  transition: all .2s;
}
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
.icon-btn.active { background: var(--accent-soft); color: var(--accent2); border-color: var(--accent); }

/* ============ 主体布局 ============ */
.body { display: flex; height: calc(100% - 54px); min-height: 0; }
.chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ============ 聊天区 ============ */
.chat-scroll { flex: 1; overflow-y: auto; padding: 28px 0 12px; }
.chat-inner { max-width: 780px; margin: 0 auto; padding: 0 28px; }

/* 空状态 */
.empty-state { padding: 42px 8px 20px; text-align: center; color: var(--text3); }
.empty-hero { font-size: 46px; margin-bottom: 10px; }
.empty-title { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 14px; color: var(--text2); margin-bottom: 26px; }
.suggest-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 6px; }
.suggest-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; text-align: left; transition: all .2s; color: var(--text);
}
.suggest-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
.suggest-card .s-icon { font-size: 20px; margin-bottom: 6px; }
.suggest-card .s-title { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.suggest-card .s-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }

/* 消息 */
.msg { display: flex; gap: 11px; margin: 16px 0; animation: msgIn .3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.msg .avatar {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; display: flex;
  align-items: center; justify-content: center; font-size: 14px; font-weight: 700; margin-top: 2px;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .avatar { background: linear-gradient(135deg, #3b82f6, #6366f1); color: #fff; }
.msg.agent .avatar { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; }
.msg .bubble {
  max-width: 82%; padding: 11px 15px; border-radius: 14px; font-size: 14.5px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
}
.msg.user .bubble { background: linear-gradient(135deg, #3b5ff0, #5b4cf0); color: #fff; border-bottom-right-radius: 4px; }
.msg.agent .bubble { background: var(--bg2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

/* 状态流（执行中轻量条目） */
.flow-item {
  display: flex; align-items: flex-start; gap: 9px; padding: 5px 0;
  font-family: var(--mono); font-size: 12.5px; color: var(--text2);
  animation: msgIn .25s ease;
}
.flow-item .f-ic { flex-shrink: 0; width: 18px; text-align: center; font-size: 12px; margin-top: 1px; }
.flow-item.tool .f-ic { color: var(--blue); }
.flow-item.ok .f-ic { color: var(--green); }
.flow-item.fail .f-ic { color: var(--red); }
.flow-item.think .f-ic { color: var(--yellow); }
.flow-item .f-body { min-width: 0; flex: 1; }
.flow-item .f-tool { color: var(--accent2); font-weight: 600; }
.flow-item .f-args { color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-item .f-res { color: var(--green); word-break: break-word; white-space: normal; }
.flow-item .f-res.err { color: var(--red); }
.flow-item .f-step { color: var(--text); font-weight: 600; font-size: 13px; }
.flow-item .f-think { color: var(--yellow); }
.flow-item .f-warn { color: var(--yellow); }

/* 思考中指示 */
.thinking-dots { display: flex; align-items: center; gap: 5px; padding: 12px 4px; }
.thinking-dots span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent2);
  animation: bounce 1.2s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay: .15s; }
.thinking-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-6px); opacity: 1; } }

/* 分隔线 */
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 8px; color: var(--text3); font-size: 11px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* 最终回答卡片 */
.answer-card {
  background: linear-gradient(160deg, var(--bg3), var(--bg2));
  border: 1px solid var(--border); border-left: 3px solid var(--green);
  border-radius: var(--radius); padding: 18px 20px; margin: 8px 0 4px;
  animation: msgIn .4s ease;
}
.answer-card .a-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--green); font-weight: 600; margin-bottom: 10px; }
.answer-card .a-body { font-size: 14.5px; line-height: 1.8; color: var(--text); white-space: pre-wrap; word-break: break-word; }

/* ============ 输入区 ============ */
.input-bar {
  border-top: 1px solid var(--border); background: var(--bg2); padding: 12px 20px 16px; flex-shrink: 0;
}
.input-inner { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
.input-box {
  flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; min-height: 46px; max-height: 140px; overflow-y: auto; cursor: text;
  font-size: 14.5px; color: var(--text); transition: border-color .2s; outline: none;
}
.input-box:focus, .input-box.focused { border-color: var(--accent); }
.input-box .ph { color: var(--text3); }
.input-box .ph b { color: var(--text2); }
.send-btn {
  background: linear-gradient(135deg, #6366f1, #7c5cf0); color: #fff; border-radius: var(--radius);
  padding: 0 20px; height: 46px; font-size: 14.5px; font-weight: 600; flex-shrink: 0;
  transition: all .2s; box-shadow: 0 2px 12px rgba(99,102,241,.3);
}
.send-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.demo-btn {
  background: var(--bg3); color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 0 14px; height: 46px; font-size: 13px; flex-shrink: 0; transition: all .2s;
}
.demo-btn:hover { color: var(--text); border-color: var(--accent); }
.input-hint { max-width: 780px; margin: 6px auto 0; font-size: 11px; color: var(--text3); padding-left: 4px; }

/* ============ 工作台 ============ */
.workbench {
  width: 0; overflow: hidden; flex-shrink: 0; background: var(--bg2); border-left: 1px solid var(--border);
  transition: width .28s cubic-bezier(.4,0,.2,1); display: flex; flex-direction: column; min-height: 0;
}
.workbench.open { width: 372px; }
.wb-head { padding: 14px 16px 10px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.wb-head .hint { font-size: 11px; color: var(--text3); font-weight: 400; }
.wb-tabs { display: flex; gap: 4px; padding: 0 12px 8px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.wb-tab {
  background: transparent; color: var(--text3); font-size: 12.5px; padding: 6px 12px; border-radius: 8px;
  display: flex; align-items: center; gap: 5px; transition: all .2s; position: relative;
}
.wb-tab:hover { color: var(--text2); }
.wb-tab.active { color: var(--accent2); background: var(--accent-soft); }
.wb-tab .cnt { font-size: 10.5px; background: var(--bg4); border-radius: 9px; padding: 1px 6px; }
.wb-tab.active .cnt { background: var(--accent); color: #fff; }
.wb-content { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }

/* 计划 */
.plan-list { list-style: none; }
.plan-item {
  display: flex; gap: 10px; padding: 9px 10px; border-radius: 9px; margin-bottom: 5px;
  background: var(--bg3); border: 1px solid transparent; font-size: 13px; transition: all .2s;
}
.plan-item.current { border-color: var(--accent); background: var(--accent-soft); }
.plan-item .p-num {
  width: 22px; height: 22px; border-radius: 7px; background: var(--bg4); color: var(--text3);
  display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
}
.plan-item.done .p-num { background: var(--green); color: #06281c; }
.plan-item.current .p-num { background: var(--accent); color: #fff; }
.plan-item .p-text { line-height: 1.5; color: var(--text2); }
.plan-item.done .p-text { color: var(--text3); text-decoration: line-through; text-decoration-color: rgba(92,100,120,.4); }
.plan-item.current .p-text { color: var(--text); }

/* 工具时间线 */
.tool-item {
  border: 1px solid var(--border); border-radius: 9px; margin-bottom: 7px; overflow: hidden; background: var(--bg3);
}
.tool-item .t-head {
  display: flex; align-items: center; gap: 8px; padding: 8px 11px; cursor: pointer; user-select: none; font-size: 12.5px;
}
.tool-item .t-head:hover { background: var(--bg4); }
.tool-item .t-ic { font-size: 12px; }
.tool-item.ok .t-ic { color: var(--green); }
.tool-item.fail .t-ic { color: var(--red); }
.tool-item .t-name { font-family: var(--mono); font-weight: 600; color: var(--accent2); }
.tool-item .t-time { margin-left: auto; font-size: 10.5px; color: var(--text3); }
.tool-item .t-arrow { color: var(--text3); font-size: 10px; transition: transform .2s; }
.tool-item.expanded .t-arrow { transform: rotate(90deg); }
.tool-item .t-detail { display: none; padding: 8px 11px; border-top: 1px solid var(--border); font-size: 12px; background: var(--bg2); }
.tool-item.expanded .t-detail { display: block; }
.tool-item .t-args { font-family: var(--mono); color: var(--text2); word-break: break-all; margin-bottom: 6px; font-size: 11.5px; }
.tool-item .t-res { color: var(--green); white-space: pre-wrap; word-break: break-word; font-size: 11.5px; }
.tool-item .t-res.err { color: var(--red); }

/* 统计 */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 12px; }
.stat-card .s-val { font-size: 20px; font-weight: 700; color: var(--text); }
.stat-card .s-val small { font-size: 12px; color: var(--text3); font-weight: 400; }
.stat-card .s-label { font-size: 11.5px; color: var(--text3); margin-top: 2px; }
.wb-empty { color: var(--text3); font-size: 12.5px; text-align: center; padding: 36px 10px; line-height: 1.8; }
.wb-empty .we-ic { font-size: 26px; margin-bottom: 8px; opacity: .5; }

@media (max-width: 900px) {
  .workbench.open { width: 100%; position: fixed; inset: 54px 0 0 0; z-index: 50; }
  .suggest-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ===== 顶栏 ===== -->
<div class="header">
  <div class="logo">
    <div class="logo-mark">✻</div>
    <div>
      <div class="logo-name">小悟</div>
      <div class="logo-sub">my_agent · 协作工作台</div>
    </div>
  </div>
  <span id="statusBadge" class="status-badge"><span class="dot"></span><span id="statusText">待命</span></span>
  <div class="goal-text" id="goalText">在聊天里说你想做什么，或点下方示例任务</div>
  <div class="header-right">
    <button class="icon-btn" id="wbToggle" title="展开/收起工作台">📋 工作台</button>
    <span id="connDot" class="conn-dot disconnected" title="WebSocket 连接状态"></span>
  </div>
</div>

<div class="body">
  <!-- ===== 聊天主区 ===== -->
  <div class="chat-col">
    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner">
        <div class="empty-state" id="emptyState">
          <div class="empty-hero">✻</div>
          <div class="empty-title">你好，我是小悟</div>
          <div class="empty-sub">不是聊天机器人，是帮你把事办成的协作者。<br>说吧，想做什么？</div>
          <div class="suggest-grid">
            <button class="suggest-card" onclick="fillExample(0)">
              <div class="s-icon">🔍</div>
              <div class="s-title">调研整理</div>
              <div class="s-desc">调研 React 19 的新特性，整理一份要点报告</div>
            </button>
            <button class="suggest-card" onclick="fillExample(1)">
              <div class="s-icon">🐛</div>
              <div class="s-title">排查问题</div>
              <div class="s-desc">帮我在项目里找出哪些测试可能不稳定，分析原因</div>
            </button>
            <button class="suggest-card" onclick="fillExample(2)">
              <div class="s-icon">📄</div>
              <div class="s-title">生成交付物</div>
              <div class="s-desc">把 README 整理成一份给新人看的快速上手文档</div>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== 输入区 ===== -->
    <div class="input-bar">
      <div class="input-inner">
        <div class="input-box" id="inputBox" contenteditable="true" spellcheck="false" tabindex="0">
          <span class="ph" id="inputPh">输入任务目标，<b>Ctrl+Enter</b> 发送；没配 API 就点「演示」看效果</span>
        </div>
        <button class="demo-btn" id="demoBtn" title="用内置模拟事件流演示界面效果">▶ 演示</button>
        <button class="send-btn" id="sendBtn">发送</button>
      </div>
      <div class="input-hint">小悟会实时汇报进度，想看得更细就打开右上角「工作台」</div>
    </div>
  </div>

  <!-- ===== 工作台侧栏 ===== -->
  <div class="workbench" id="workbench">
    <div class="wb-head">📋 工作台 <span class="hint">Agent 执行过程实时展开</span></div>
    <div class="wb-tabs">
      <button class="wb-tab active" id="tabPlan" onclick="switchTab('plan')">计划 <span class="cnt" id="cntPlan">0</span></button>
      <button class="wb-tab" id="tabTools" onclick="switchTab('tools')">工具 <span class="cnt" id="cntTools">0</span></button>
      <button class="wb-tab" id="tabStats" onclick="switchTab('stats')">统计</button>
    </div>
    <div class="wb-content" id="wbContent">
      <div class="wb-empty" id="wbEmpty"><div class="we-ic">🧘</div>工作台暂时空着。<br>给个任务试试，Agent 的每一步都会实时铺到这里。</div>
    </div>
  </div>
</div>

<script>
/* ================= 状态 ================= */
const state = {
  goal: '', status: 'idle', plan: [], currentStep: -1,
  tools: [], toolsMap: {}, startTime: null, answerShown: false,
};
let ws = null, connected = false;
const $ = id => document.getElementById(id);
const chatScroll = $('chatScroll'), chatInner = $('chatInner'), emptyState = $('emptyState');
const EXAMPLES = [
  '调研 React 19 的新特性，整理一份要点报告',
  '帮我在项目里找出哪些测试可能不稳定，分析原因',
  '把 README 整理成一份给新人看的快速上手文档',
];

/* ================= 工具函数 ================= */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}
function fmtTime(ts) {
  if (!ts) return '';
  return new Date(ts * 1000).toLocaleTimeString('zh-CN', { hour12: false });
}
function fmtDur(sec) {
  if (sec == null || isNaN(sec)) return '—';
  if (sec < 60) return sec.toFixed(1) + 's';
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + 'm' + String(s).padStart(2, '0') + 's';
}
function shortArgs(args) {
  if (!args) return '';
  let s = typeof args === 'string' ? args : JSON.stringify(args, null, 0);
  if (s.length > 110) s = s.slice(0, 110) + '…';
  return s;
}
function nowTs() { return Date.now() / 1000; }
function hideEmpty() {
  if (emptyState && emptyState.parentNode) emptyState.remove();
}
function scrollBottom() {
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

/* ================= 顶栏 ================= */
function setStatus(status, text) {
  state.status = status;
  const badge = $('statusBadge'), st = $('statusText');
  badge.className = 'status-badge ' + (status === 'running' ? 'running'
    : status === 'completed' ? 'completed' : status === 'error' ? 'error' : '');
  st.textContent = text;
  $('sendBtn').disabled = (status === 'running');
  $('demoBtn').disabled = (status === 'running');
  if (status === 'running') $('goalText').textContent = '目标：' + state.goal;
}

/* ================= 聊天渲染 ================= */
function addMsg(role, text) {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="avatar">' + (role === 'user' ? '你' : '✻') + '</div><div class="bubble">' + esc(text) + '</div>';
  chatInner.appendChild(div);
  scrollBottom();
}
function addFlow(cls, icon, html) {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'flow-item ' + cls;
  div.innerHTML = '<div class="f-ic">' + icon + '</div><div class="f-body">' + html + '</div>';
  chatInner.appendChild(div);
  scrollBottom();
}
function showThinking() {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'thinking-dots';
  div.id = 'thinkingDots';
  div.innerHTML = '<span></span><span></span><span></span>';
  chatInner.appendChild(div);
  scrollBottom();
}
function hideThinking() {
  const t = $('thinkingDots');
  if (t) t.remove();
}
function showAnswer(text) {
  hideThinking();
  if (state.answerShown) return;
  state.answerShown = true;
  const div = document.createElement('div');
  div.className = 'answer-card';
  div.innerHTML = '<div class="a-head">✓ 任务完成 · 小悟的交付</div><div class="a-body">' + esc(text || '(无输出)') + '</div>';
  chatInner.appendChild(div);
  scrollBottom();
}

/* ================= 工作台 ================= */
let wbTab = 'plan';
function toggleWorkbench() {
  const wb = $('workbench'), btn = $('wbToggle');
  const open = wb.classList.toggle('open');
  btn.classList.toggle('active', open);
}
function switchTab(tab) {
  wbTab = tab;
  ['plan', 'tools', 'stats'].forEach(t => $('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab));
  renderWorkbench();
}
function renderWorkbench() {
  const c = $('wbContent');
  if (state.status === 'idle' && state.plan.length === 0) {
    c.innerHTML = '<div class="wb-empty"><div class="we-ic">🧘</div>工作台暂时空着。<br>给个任务试试，Agent 的每一步都会实时铺到这里。</div>';
    return;
  }
  if (wbTab === 'plan') {
    if (!state.plan.length) {
      c.innerHTML = '<div class="wb-empty"><div class="we-ic">🗺️</div>计划生成后，会按步骤实时勾选进度。</div>';
      return;
    }
    c.innerHTML = '<ul class="plan-list">' + state.plan.map((p, i) => {
      const cls = i < state.currentStep ? 'done' : i === state.currentStep ? 'current' : '';
      const mark = i < state.currentStep ? '✓' : (i === state.currentStep ? '●' : i + 1);
      return '<li class="plan-item ' + cls + '"><div class="p-num">' + mark + '</div><div class="p-text">' + esc(p) + '</div></li>';
    }).join('') + '</ul>';
  } else if (wbTab === 'tools') {
    if (!state.tools.length) {
      c.innerHTML = '<div class="wb-empty"><div class="we-ic">🔧</div>还没有工具调用记录。</div>';
      return;
    }
    c.innerHTML = state.tools.slice().reverse().map(t => {
      const ok = t.success;
      const res = ok
        ? (t.resultText ? esc(t.resultText) : '<i style="color:var(--text3)">执行成功</i>')
        : '<span class="err" style="color:var(--red)">' + esc(t.errorText || '执行失败') + '</span>';
      return '<div class="tool-item ' + (ok ? 'ok' : 'fail') + '">'
        + '<div class="t-head" onclick="this.parentNode.classList.toggle('expanded')">'
        + '<span class="t-ic">' + (ok ? '✓' : '✗') + '</span>'
        + '<span class="t-name">' + esc(t.tool) + '</span>'
        + '<span class="t-args">' + esc(shortArgs(t.input)) + '</span>'
        + '<span class="t-time">' + fmtTime(t.ts) + '</span>'
        + '<span class="t-arrow">▶</span></div>'
        + '<div class="t-detail"><div class="t-args">' + esc(t.fullInput || t.input || '') + '</div><div class="t-res' + (ok ? '' : ' err') + '">' + res + '</div></div>'
        + '</div>';
    }).join('');
  } else {
    const dur = state.startTime ? nowTs() - state.startTime : 0;
    const okTools = state.tools.filter(t => t.success).length;
    const failTools = state.tools.length - okTools;
    const names = {};
    state.tools.forEach(t => { names[t.tool] = (names[t.tool] || 0) + 1; });
    const topTools = Object.entries(names).sort((a, b) => b[1] - a[1]).slice(0, 4)
      .map(([n, cnt]) => '<div class="stat-card"><div class="s-val">' + cnt + ' <small>次</small></div><div class="s-label">' + esc(n) + '</div></div>').join('');
    c.innerHTML = '<div class="stats-grid">'
      + '<div class="stat-card"><div class="s-val">' + (state.plan.length || 0) + ' <small>步</small></div><div class="s-label">计划步骤</div></div>'
      + '<div class="stat-card"><div class="s-val">' + state.tools.length + ' <small>次</small></div><div class="s-label">工具调用</div></div>'
      + '<div class="stat-card"><div class="s-val">' + okTools + ' <small>/ ' + failTools + ' 失败</small></div><div class="s-label">成功 / 失败</div></div>'
      + '<div class="stat-card"><div class="s-val">' + fmtDur(dur) + '</div><div class="s-label">已耗时</div></div>'
      + (topTools ? '<div class="stats-grid" style="grid-column:1/-1">' + topTools + '</div>' : '')
      + '</div>';
  }
}
function updateCounts() {
  $('cntPlan').textContent = state.plan.length;
  $('cntTools').textContent = state.tools.length;
}

/* ================= 事件处理 ================= */
function handleEvent(evt) {
  const type = evt.type, data = evt.data || {};
  if (type === 'run_start') {
    state.goal = data.goal || state.goal;
    state.plan = []; state.currentStep = -1; state.tools = []; state.toolsMap = {};
    state.startTime = nowTs(); state.answerShown = false;
    hideThinking();
    addMsg('user', state.goal);
    addFlow('think', '●', '<span>小悟开始干活了，正在拆解任务…</span>');
    setStatus('running', '思考中');
    updateCounts(); renderWorkbench();
  } else if (type === 'plan') {
    state.plan = (data.steps || []).map(s => (typeof s === 'string' ? s : s.description || JSON.stringify(s)));
    state.currentStep = -1;
    hideThinking();
    addFlow('think', '·', '计划成型：' + state.plan.length + ' 步，马上开始执行');
    setStatus('running', '已出计划');
    updateCounts(); renderWorkbench();
  } else if (type === 'step_start') {
    state.currentStep = (data.step || 1) - 1;
    hideThinking();
    addFlow('think', '▸', '<span class="f-step">步骤 ' + (data.step || '') + '/' + (data.total || state.plan.length) + ' · ' + esc(data.description || '') + '</span>');
    setStatus('running', '执行中');
    renderWorkbench();
  } else if (type === 'tool_call') {
    hideThinking();
    addFlow('tool', '⏺', '<span class="f-tool">' + esc(data.tool || '') + '</span>(<span class="f-args">' + esc(shortArgs(data.input || data.arguments || data.args || '')) + '</span>)');
    if (state.toolsMap[data.tool]) {
      // 同一工具再次调用：标记上一条未配对的
    }
    const rec = { tool: data.tool || '', input: data.input || data.arguments || data.args || '',
                  fullInput: data.input || data.arguments || data.args || '',
                  success: null, resultText: '', errorText: '', ts: evt.timestamp || nowTs() };
    state.toolsMap[data.tool] = rec;
    state.tools.push(rec);
    updateCounts();
  } else if (type === 'tool_result') {
    const rec = state.toolsMap[data.tool] || state.tools[state.tools.length - 1];
    if (rec) {
      rec.success = !!data.success;
      rec.resultText = (data.output || '').slice(0, 220);
      rec.errorText = (data.error || '').slice(0, 220);
      const ok = !!data.success;
      addFlow(ok ? 'ok' : 'fail', ok ? '⎿' : '⎿✗',
        '<span class="f-res' + (ok ? '' : ' err') + '">' + esc(ok ? shortArgs(data.output) : (data.error || '失败')) + '</span>');
    }
    renderWorkbench();
  } else if (type === 'answer') {
    hideThinking();
    showAnswer(data.output || data.result || '(完成)');
  } else if (type === 'run_end') {
    hideThinking();
    state.currentStep = state.plan.length;
    const ok = (data.status === 'completed');
    setStatus(ok ? 'completed' : 'error', ok ? '完成' : '出错');
    $('goalText').textContent = state.goal;
    if (data.summary && !state.answerShown) showAnswer(data.summary);
    if (!ok && data.error) addFlow('fail', '✗', '<span class="f-res err">' + esc(String(data.error).slice(0, 300)) + '</span>');
    renderWorkbench(); updateCounts();
  } else if (type === 'error') {
    hideThinking();
    addFlow('fail', '✗', '<span class="f-res err">' + esc(data.message || data.error || '出错了') + '</span>');
    setStatus('error', '出错');
    renderWorkbench();
  } else if (type === 'model_turn') {
    // LLM 决策轮：展示思考与拟用工具（轻量，不打断主流程）
    const thought = data.content || '';
    const tools = data.tool_calls || [];
    if (thought) addFlow('think', '🧠', '<span class="f-think">' + esc(typeof thought === 'string' ? thought : JSON.stringify(thought)).slice(0, 160) + '</span>');
    if (tools && tools.length) addFlow('tool', '→', '<span class="f-tool">下一步: ' + esc(tools.join(', ')).slice(0, 120) + '</span>');
    setStatus('running', '决策中');
  } else if (type === 'approval') {
    const dec = data.decision || '';
    addFlow(dec === 'deny' ? 'fail' : 'warn', '🔐', '<span class="f-' + (dec === 'deny' ? 'res err' : 'warn') + '">审批' + (dec === 'deny' ? '拒绝' : '通过') + ' · ' + esc(data.tool || '') + (data.reason ? '：' + esc(String(data.reason).slice(0, 120)) : '') + '</span>');
  } else if (type === 'guardian') {
    const v = data.verdict || '';
    addFlow(v === 'block' ? 'fail' : 'warn', '🛡', '<span class="f-' + (v === 'block' ? 'res err' : 'warn') + '">Guardian ' + (v === 'block' ? '拦截' : '提醒') + ': ' + esc(String(data.reason || '').slice(0, 140)) + '</span>');
  } else if (type === 'llm_retry' || type === 'llm_error') {
    const isErr = type === 'llm_error';
    addFlow(isErr ? 'fail' : 'warn', isErr ? '✗' : '↻', '<span class="f-' + (isErr ? 'res err' : 'warn') + '">' + (isErr ? '模型调用失败' : '模型重试') + ': ' + esc(String(data.error || data.message || '').slice(0, 140)) + '</span>');
    if (isErr) setStatus('error', '模型出错');
  } else if (type === 'checkpoint') {
    addFlow('ok', '⧉', '<span class="f-res">快照: ' + esc(data.file || '').slice(0, 100) + '</span>');
  } else if (type === 'run_loop_start') {
    addFlow('think', '▶', '<span>单循环执行开始，一次对话完成目标</span>');
    setStatus('running', '执行中');
  } else if (type === 'run_loop_end') {
    if (data.success === false && data.error) {
      addFlow('fail', '✗', '<span class="f-res err">' + esc(String(data.error).slice(0, 200)) + '</span>');
    }
  } else if (type === 'step_end' || type === 'ops_warning' || type === 'empty_turn' || type === 'no_tools_fallback') {
    // 过程性事件：静默兜底，仅在工作台计数中体现
    renderWorkbench();
  }
}

/* ================= WebSocket ================= */
function setConn(on) {
  connected = on;
  $('connDot').classList.toggle('disconnected', !on);
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { setConn(true); ws.send(JSON.stringify({ type: 'get_state' })); };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state_snapshot') return;
      handleEvent(msg);
    } catch (err) { /* 忽略坏消息 */ }
  };
  ws.onclose = () => { setConn(false); setTimeout(connect, 2000); };
  ws.onerror = () => { setConn(false); };
}

/* ================= 发送 ================= */
function fillExample(i) {
  $('inputBox').innerHTML = esc(EXAMPLES[i]);
  $('inputBox').focus();
}
function getInputText() {
  return $('inputBox').innerText.replace(/\u00a0/g, ' ').trim();
}
function clearInput() {
  $('inputBox').innerHTML = '';
  $('inputPh').style.display = 'inline';
}
async function sendGoal(demo) {
  const goal = getInputText();
  if (!goal || state.status === 'running') return;
  if (demo === undefined) demo = false;
  try {
    const resp = await fetch(demo ? '/api/demo' : '/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goal }),
    });
    const r = await resp.json();
    if (!r.ok) { alert(r.error || '启动失败'); return; }
  } catch (err) {
    alert('请求失败: ' + err);
    return;
  }
  state.goal = goal;
  clearInput();
}
function onInputKey(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendGoal(false);
  }
  if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
    e.preventDefault();
    sendGoal(false);
  }
}

/* ================= 初始化 ================= */
$('inputBox').addEventListener('input', () => {
  $('inputPh').style.display = $('inputBox').innerText.trim() ? 'none' : 'inline';
});
$('inputBox').addEventListener('keydown', onInputKey);
$('inputBox').addEventListener('focus', () => $('inputBox').classList.add('focused'));
$('inputBox').addEventListener('blur', () => $('inputBox').classList.remove('focused'));
$('sendBtn').addEventListener('click', () => sendGoal(false));
$('demoBtn').addEventListener('click', () => sendGoal(true));
$('wbToggle').addEventListener('click', toggleWorkbench);
connect();
setTimeout(() => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'get_state' })); }, 600);
</script>
